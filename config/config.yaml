# Go版本的简化配置文件
database:
  host: "localhost"
  port: 8123
  database: "data4trend"
  username: "default"
  password: "123456"
  table: "klines_1m"

websocket:
  base_url: "wss://stream.binance.com:9443"
  reconnect_interval: 30
  ping_interval: 30
  max_retries: 5
  timeout: 30
  # symbols列表将从币安API动态获取
  # 支持所有USDT交易对
  auto_fetch_symbols: true
  symbol_filter:
    quote_asset: USDT
    exclude_patterns:
      - UP
      - DOWN
      - BEAR
      - BULL

api:
  host: "0.0.0.0"
  port: 8080

kafka:
  brokers:
    - "localhost:9092"
  topic: "binance_klines"
  producer:
    batch_size: 100
    batch_timeout: "1s"
    compression: "snappy"
    max_message_bytes: 1000000
  consumer:
    group_id: "data4trend_consumer"
    auto_offset_reset: "latest"
    session_timeout: "30s"
    heartbeat_interval: "3s"

batch_writer:
  batch_size: 1000
  batch_timeout: "60s"
  max_retries: 3
  retry_interval: "5s"

# 数据校验与回补服务配置
validator:
  enabled: true
  check_interval: "5m"        # 检查间隔
  max_gap_duration: "24h"     # 最大允许修复的数据间隙时长
  history_days: 7             # 检查历史数据的天数
  batch_size: 100             # 批量处理大小
  concurrent_workers: 3       # 并发工作线程数

proxy:
  enabled: true
  type: "socks5"
  host: "127.0.0.1"
  port: 7890

interval: "1m"