binance:
  api_key: ""  # 不需要API密钥就可以获取公共K线数据
  secret_key: ""

clickhouse:
  host: "localhost"
  port: 9000
  http_port: 8123
  user: "default"
  password: "123456"
  database: "data4trend"

server:
  port: 8080
  env: development

http:
  timeout: 30
  proxy: "http://127.0.0.1:7890"  # 如果需要代理，请设置，否则留空
  
# 币种配置文件路径
symbols_config_path: "config/symbols.yaml"

# 性能配置
performance:
  workers: 20           # 并发工作器数量（建议10-30，根据网络和机器性能调整）
  max_db_connections: 50  # 数据库最大连接数
  data_channel_buffer: 20000  # 数据通道缓冲区大小
  task_queue_size: 2000   # 任务队列容量

log:
  level: "debug"
  json_format: false
  output_path: "logs/dataFeeder.log"
  # 日志轮转配置
  max_size: 250      # 单个日志文件最大大小（MB）
  max_age: 7         # 日志文件保留天数
  max_backups: 5     # 最多保留5个备份文件
  compress: true     # 压缩备份文件以节省空间
