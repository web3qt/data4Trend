# 币种配置 - 物化视图架构
groups:
  # 主交易对组，用于自动发现的币种
  main:
    symbols: []  # 将由程序自动填充币安所有数字货币
    intervals: ["15m", "1h", "1d"]  # 启用15分钟、1小时、1天时间周期
    # 物化视图架构：统一开始时间，所有数据从1分钟原始数据开始收集
    start_time: "2019-01-01T00:00:00Z"  # 统一数据收集开始时间
    enabled: true
    poll_intervals:
      "15m": "15m"
      "1h": "1h" 
      "1d": "24h"
  
# 全局设置
settings:
  max_symbols_per_batch: 30  # 每批处理的币种数，增加到30个
  discovery_enabled: true # 启用自动发现新币种
  discovery_interval: 6h # 缩短自动发现新币种的间隔
  excluded_symbols: # 排除的币种
    - USDCUSDT
    - BUSDUSDT
    - TUSDUSDT
  # 全局开始时间配置，适用于所有新发现的币种
  global_start_time: "2019-01-01T00:00:00Z"  # 币种数据收集的全局开始时间
