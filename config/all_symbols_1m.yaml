# Data4Trend 全币种1分钟K线收集配置
# 支持获取币安所有代币的1m数据，从上市时间开始收集

# 数据库配置
clickhouse:
  host: "localhost"
  port: 9000
  http_port: 8123
  database: "data4trend"
  user: "default"
  password: "123456"
  max_open_conns: 50
  max_idle_conns: 25
  conn_max_lifetime: "1h"

# Binance API配置
binance:
  api_key: ""
  secret_key: ""
  base_url: "https://api.binance.com"

# HTTP客户端配置
http:
  timeout: 60
  proxy: ""

# 性能配置 - 针对大量币种优化
performance:
  workers: 50  # 增加工作协程数以处理更多币种
  data_channel_buffer: 10000
  task_queue_size: 2000

# 日志配置
log:
  level: "info"
  format: "json"
  output_path: "logs/all_symbols_1m.log"
  max_size: 500
  max_backups: 10
  max_age: 30
  compress: true

# 符号配置 - 动态发现模式
symbols:
  # 空列表，启用自动发现所有交易对
  - symbol: "BTCUSDT"
    enabled: true
    start_time: "2019-01-01T00:00:00Z"
    intervals:
      - "1m"
  - symbol: "ETHUSDT"  
    enabled: true
    start_time: "2019-01-01T00:00:00Z"
    intervals:
      - "1m"

# 全局设置用于动态发现
settings:
  max_symbols_per_batch: 50  # 每批处理50个币种
  discovery_enabled: true    # 启用自动发现新币种
  discovery_interval: 1h     # 每小时检查新币种
  excluded_symbols:
    - USDCUSDT
    - BUSDUSDT
    - TUSDUSDT
  
  # 智能收集设置
  smart_collection:
    enabled: true
    use_listing_time: true  # 从实际上市时间开始收集
    fallback_start: "2019-01-01T00:00:00Z"  # 默认起始时间
    auto_adjust: true       # 根据币种上市时间自动调整