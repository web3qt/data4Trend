# Test configuration for 1-minute data collection
clickhouse:
  host: "localhost"
  port: 9000
  http_port: 8123
  database: "data4trend"
  user: "default"
  password: "123456"

binance:
  api_key: ""
  secret_key: ""

symbols:
  - symbol: "BTCUSDT"
    enabled: true
    start_time: "2024-07-17T00:00:00Z"  # Start from today
    intervals:
      - "1m"

performance:
  workers: 5
  data_channel_buffer: 1000
  task_queue_size: 500

log:
  level: "debug"
  format: "text"
  output_path: "logs/test_data4trend.log"