# Test configuration for 1-minute data collection - recent data
clickhouse:
  host: "localhost"
  port: 9000
  http_port: 8123
  database: "data4trend"
  user: "default"
  password: "123456"

binance:
  api_key: ""
  secret_key: ""

symbols:
  - symbol: "BTCUSDT"
    enabled: true
    start_time: "2024-07-17T17:00:00Z"  # Start from just a few minutes ago
    intervals:
      - "1m"

performance:
  workers: 3
  data_channel_buffer: 500
  task_queue_size: 200

log:
  level: "info"
  format: "text"
  output_path: "logs/1min_test.log"